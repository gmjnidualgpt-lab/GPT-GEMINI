name: Deploy Most Nowy Cleaner

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cleaner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: node --check cloudflare-worker/worker.js

      - name: Run Worker smoke tests
        run: node --test cloudflare-worker/worker.test.js

      - name: Validate deployment config
        run: |
          test -f cloudflare-worker/wrangler.jsonc
          grep -q '"name": "google-drive-cleaner-ai"' cloudflare-worker/wrangler.jsonc
          grep -q '"binding": "OAUTH_KV"' cloudflare-worker/wrangler.jsonc

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3be7172e01f9c217a48fcbacb539af0f
          command: deploy --config cloudflare-worker/wrangler.jsonc
